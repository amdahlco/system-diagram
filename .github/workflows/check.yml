# Builds the example and runs the checker on every pull request and every push to main.
# Every action is pinned to a full commit; Dependabot proposes updates (see dependabot.yml).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Build the example
        run: |
          python3 build.py examples/skeleton/data.json --strict --out "$RUNNER_TEMP/page.html"
          python3 build.py examples/skeleton/data.json --strict --standalone --out "$RUNNER_TEMP/page-standalone.html"

      - name: Set up the checker (locked install)
        working-directory: tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright-core install --with-deps chromium

      - name: Run the checker
        run: |
          node tools/check.mjs "$RUNNER_TEMP/page.html" "$RUNNER_TEMP/check"
          node tools/check.mjs "$RUNNER_TEMP/page-standalone.html" "$RUNNER_TEMP/check-standalone"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checker-screenshots
          path: ${{ runner.temp }}/check*
          if-no-files-found: ignore
          retention-days: 14
