# Lints every workflow with zizmor on each pull request and push to main.
name: lint-workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install zizmor (pinned by hash)
        run: |
          python3 -m pip install --require-hashes --only-binary :all: --no-deps -r .github/zizmor-requirements.txt
      - name: Lint the workflows
        run: zizmor --offline --format plain .github/workflows
