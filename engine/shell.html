<title>/*__TITLE__*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*__FONTS__*/
/*__THEME__*/
/* Layout: a header, a tab bar, then the open view on the left and a reading panel on the right that explains whatever was clicked. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--muted); }
.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 18px 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.1; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
h1 .dot { color: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 500; }
.stats span + span { border-left: 1px solid var(--line); padding-left: 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--muted); border-radius: 2px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--surface); font-weight: 550; }
.tab .n { font-family: var(--font-mono); font-size: 11px; color: var(--accent-ink); margin-left: 4px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
.view { display: none; min-width: 0; padding-block: 18px 48px; padding-right: 20px; border-right: 1px solid var(--line); min-height: 70vh; }
.view.on { display: block; }
.panel { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow: auto; padding: 18px 0 40px 20px; }

/* Journey grid */
.j-scroll { overflow-x: auto; padding-bottom: 6px; padding-right: 10px; } /* room for the last step's arrowhead */
.j-grid { --lanew: 116px; display: grid; grid-template-columns: var(--lanew) repeat(var(--n), minmax(var(--colmin), 1fr)); gap: 0 8px; min-width: calc(var(--lanew) + var(--n) * (var(--colmin) + 8px)); }
.j-phone { display: none; font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 0 0 8px; }
.j-phone.show { display: block; }
.j-span { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); border-top: 1.5px solid var(--accent); padding: 5px 0 12px; position: relative; }
.j-span::before, .j-span::after { content: ""; position: absolute; top: -5px; width: 1.5px; height: 9px; background: var(--accent); }
.j-span::before { left: 0; } .j-span::after { right: 0; }
.j-span.quiet { color: var(--muted); border-top-color: var(--faint); }
.j-span.quiet::before, .j-span.quiet::after { background: var(--faint); }
.j-corner { display: flex; align-items: flex-end; padding: 0 8px 10px 0; }
.j-hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
.j-stage { padding: 0 0 10px; border-bottom: 2px solid var(--ink); display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; position: relative; }
.j-stage::after { content: ""; position: absolute; right: -9px; bottom: -6px; border-left: 8px solid var(--ink); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.j-stage .k { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.j-stage b { font-size: 14px; font-weight: 650; line-height: 1.2; }
.j-stage span { font-size: 11.5px; color: var(--muted); }
.j-who, .j-cell { border-bottom: 1px solid var(--line); padding-block: 12px; }
.j-who { display: flex; flex-direction: column; gap: 3px; padding-right: 8px; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; cursor: pointer; }
.j-who:hover b { text-decoration: underline; text-underline-offset: 3px; }
.j-who b { font-size: 13.5px; line-height: 1.2; display: flex; align-items: center; gap: 7px; }
.j-who b i, .j-t i { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.j-who > span { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.j-cell { display: flex; flex-direction: column; gap: 6px; min-height: 52px; min-width: 0; }
.j-item { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 7px 9px; font-size: 12.5px; line-height: 1.3; cursor: pointer; display: flex; flex-direction: column; gap: 3px; color: var(--ink); overflow-wrap: anywhere; }
.j-item:hover { border-color: var(--ink); }
.j-t { display: flex; gap: 7px; align-items: baseline; }
.j-t i { position: relative; top: 1px; }
.j-t > span, .j-who b > span { min-width: 0; }
.j-item.optional { border-style: dashed; background: transparent; color: var(--muted); }
.j-item.optional .j-t i { background: transparent; border: 1.5px dashed var(--c); }
.j-item em { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-left: 16px; }
.j-item em.wait { color: var(--accent-ink); }
.j-item em.gap { color: var(--neg); }
.j-item.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.j-item.lit { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.j-item.faded { opacity: .28; }
.j-slh { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 12px; }
.j-sl { background: none; border: 0; padding: 12px 0 0; text-align: left; cursor: pointer; font-family: var(--font-mono); font-size: 11px; line-height: 1.5; color: var(--c4); overflow-wrap: anywhere; }
.j-sl:hover { text-decoration: underline; text-underline-offset: 3px; }
.j-sl.none { color: var(--faint); cursor: default; text-decoration: none; }
.j-band { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 0 0; font-size: 12.5px; }
.j-band b { font-weight: 600; margin-right: 4px; }
.j-chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 9px; border-radius: 3px; font-size: 12px; cursor: pointer; color: var(--ink); text-align: left; }
.j-chip:hover { border-color: var(--ink); }
.j-chip.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.j-chip.lit { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.j-chip.faded { opacity: .35; }
.j-flags { margin-top: 18px; }
.j-chip .to { color: var(--muted); }

/* Panel */
.panel h2 { font-size: 20px; line-height: 1.2; margin: 0 0 6px; font-weight: 650; text-wrap: balance; }
.panel h3 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 20px 0 6px; }
.panel .sections h3 { color: var(--ink); }
.panel p { margin: 0 0 8px; }
.panel ul { margin: 0 0 8px; padding-left: 18px; }
.panel li { margin-bottom: 3px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.where { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.where code { display: block; background: var(--raise); border-radius: 2px; padding: 3px 7px; overflow-wrap: anywhere; color: var(--ink); }
.callout { border-left: 3px solid var(--c1); background: var(--warn-soft); padding: 8px 10px; margin: 10px 0; }
.callout.gap { border-left-color: var(--neg); background: var(--neg-soft); }
.callout.note { border-left-color: var(--faint); background: var(--raise); }
.callout.built { border-left-color: var(--pos); background: var(--raise); }
.callout .k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 13px; margin: 8px 0 4px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.legend i.dash { background: transparent; border: 1.5px dashed var(--faint); }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); }
.pill.wait { color: var(--accent-ink); }
.pill.gap { color: var(--neg); }
.pill.built { color: var(--pos); font-size: 10.5px; }
.pill.partly { color: var(--accent-ink); font-size: 10.5px; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.panel li .lnk { display: inline; }
.rowbtn { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.sub { display: block; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.foot { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 18px; }

/* Pages */
.page-inner { max-width: 1000px; }
.page-h { font-size: 22px; margin: 0 0 4px; font-weight: 650; text-wrap: balance; }
.lede { color: var(--muted); max-width: 72ch; margin: 0 0 18px; }
.lede.after { margin: 10px 0 0; }
.group-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 30px 0 8px; }
.svgwrap, .tablewrap { overflow-x: auto; }
.svgwrap svg { display: block; }
.pc { cursor: pointer; }
.pc rect.box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.pc:hover rect.box, .pc:focus-visible rect.box { stroke: var(--ink); }
.pc.sel rect.box { stroke: var(--ink); stroke-width: 2; }
.pc.ext rect.box { fill: transparent; stroke-dasharray: 5 4; stroke: var(--faint); }
.pc.gate rect.box { fill: var(--ink); stroke: var(--ink); }
.pc.gate text { fill: var(--bg); }
.svg-t { font-family: var(--font-sans); font-size: 14px; font-weight: 650; fill: var(--ink); }
.svg-s { font-family: var(--font-sans); font-size: 12px; fill: var(--muted); }
.svg-e { fill: none; stroke: var(--ink); stroke-width: 1.3; opacity: .55; stroke-linejoin: round; }
.svg-e.dashed { stroke-dasharray: 4 4; }
.svg-lane { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; fill: var(--muted); }
.svg-div { stroke: var(--line); }
.mx { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.mx th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 0 12px 8px 0; border-bottom: 2px solid var(--ink); vertical-align: bottom; }
.mx td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.mx td.m { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.mx td.s { color: var(--muted); font-size: 12.5px; }
.mx .neg { color: var(--neg); font-weight: 600; }
.mx .pos { color: var(--pos); }
.mx tr.click { cursor: pointer; }
.mx tr.click:hover td, .mx tr.sel td { background: var(--raise); }
.dot { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--c); }
.dot.hollow i { background: transparent; border: 1.5px solid var(--c); }
.bars { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; align-items: center; max-width: 820px; }
.bars .nm { font-weight: 600; font-size: 13.5px; }
.bars .row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-width: 0; }
.bars .b { height: 16px; border-radius: 2px; flex: none; }
.bars .v { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.bars .how { font-size: 12.5px; color: var(--muted); min-width: 0; flex: 1 1 14ch; }
.takeaways { margin: 14px 0 0; padding-left: 18px; max-width: 78ch; }
.takeaways li { margin-bottom: 4px; }
.stats-row { display: grid; grid-template-columns: repeat(var(--k, 4), minmax(0, 1fr)); border-top: 1px solid var(--line); }
.stats-row > div { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.stats-row .big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stats-row .s { font-size: 12.5px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(var(--k, 4), minmax(0, 1fr)); border-top: 1px solid var(--line); }
.cards > div { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.cards b { display: block; font-size: 13.5px; }
.cards span { font-size: 12.5px; color: var(--muted); }
.meter { margin: 6px 0 22px; }
.meter-h { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; margin-bottom: 6px; }
.track { position: relative; height: 14px; background: var(--raise); border-radius: 2px; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 2px; opacity: .75; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.room { height: 70px; position: relative; }
.tick-l { position: absolute; top: 22px; font-size: 12px; line-height: 1.3; color: var(--muted); transform: translateX(-50%); width: max-content; max-width: 150px; text-align: center; }
.tick-l b { color: var(--ink); font-weight: 600; display: block; font-family: var(--font-mono); font-size: 11.5px; }
.tick-l.r { transform: translateX(-100%); text-align: right; }
.tick-l.l { transform: none; text-align: left; }
.flag { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; border-left: 3px solid var(--neg); background: var(--neg-soft); padding: 10px 12px; margin: 12px 0; max-width: 78ch; }
.flag .rank { font-family: var(--font-mono); font-size: 15px; color: var(--neg); }
.flag h4 { margin: 0 0 2px; font-size: 14.5px; font-weight: 600; }
.flag p { margin: 0 0 4px; }
.flag .src { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.checklist { list-style: none; padding: 0; margin: 0; max-width: 78ch; }
.checklist li { display: grid; grid-template-columns: 22px minmax(0, 1fr); padding: 7px 0; border-top: 1px solid var(--line); }
.checklist li::before { content: ""; width: 12px; height: 12px; border: 1.5px solid var(--ink); border-radius: 2px; margin-top: 4px; }
.checklist li.done::before { background: var(--ink); }
.checklist li.go::before { background: var(--accent); border-color: var(--accent); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.defs { list-style: none; padding: 0; margin: 0; }
.defs li { padding: 10px 0; border-top: 1px solid var(--line); max-width: 78ch; }
.prose p { max-width: 72ch; margin: 0 0 10px; }
@media (max-width: 960px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .view { border-right: 0; padding-right: 0; min-height: 0; border-bottom: 1px solid var(--line); }
  .panel { position: static; max-height: none; padding: 16px 0 40px; }
  .stats-row, .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bars { grid-template-columns: 110px minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .stats { flex-direction: column; gap: 2px; }
  .stats span + span { border-left: 0; padding-left: 0; }
  .j-grid { --lanew: 88px; }
  .j-who b { font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="headline"></h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="bar"><div class="tabs" role="tablist" id="tabs"></div></div>
  <div class="main" id="main">
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
